<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erro {{ error_code }} — Análysis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/platform.css') }}" rel="stylesheet">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('varredura-pdf-theme') || 'dark'; } catch (_) { document.documentElement.dataset.theme = 'dark'; }</script>
</head>
<body class="platform-error-page">
  <main class="platform-error-content" aria-labelledby="platform-error-title">
    <section class="platform-error-card">
      <img class="platform-error-robot" src="{{ url_for('static', filename='img/assistant/robot_assistente.png') }}" alt="Assistente Análysis" width="224" height="224">
      <p class="platform-error-code" aria-hidden="true">Erro {{ error_code }}</p>
      <h1 id="platform-error-title">{{ title }}</h1>
      <p>{{ message }}</p>
      {% if secondary_message %}<p class="platform-error-secondary">{{ secondary_message }}</p>{% endif %}
      <a class="btn btn-primary" href="{{ action_url }}">{{ action_label }}</a>
    </section>
  </main>
</body>
</html>
