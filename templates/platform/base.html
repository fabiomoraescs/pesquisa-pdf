<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Raspagem de Dados{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/platform.css') }}" rel="stylesheet">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('varredura-pdf-theme') || 'dark'; } catch (_) { document.documentElement.dataset.theme = 'dark'; }</script>
</head>
<body class="platform-page{% if mode in ('login', 'register') or request.endpoint in ('auth.forgot_password', 'auth.reset_password') %} platform-auth-page{% endif %}">
  {% include 'platform/_header.html' %}
  <main class="platform-main{% if mode in ('login', 'register') or request.endpoint in ('auth.forgot_password', 'auth.reset_password') %} platform-main-auth{% endif %}">
    <div class="app-content-container">
    {% block page_intro %}{% endblock %}
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}" role="alert">{{ message }}</div>{% endfor %}{% endwith %}
    {% block body %}{% endblock %}
    </div>
  </main>
  {% include 'platform/_footer.html' %}
  <script src="{{ url_for('static', filename='js/interface.js') }}"></script>
  <script src="{{ url_for('static', filename='js/platform.js') }}"></script>
</body>
</html>
