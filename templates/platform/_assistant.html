{% set assistant_project = project if project is defined else selected_project if selected_project is defined else legacy_project if legacy_project is defined else none %}
<div class="platform-assistant" data-assistant data-assistant-context="{{ assistant_context.key }}"{% if assistant_project %} data-project-id="{{ assistant_project.id }}" data-project-name="{{ assistant_project.name }}"{% endif %}>
  <section class="platform-assistant-panel" id="platform-assistant-panel" data-assistant-panel role="dialog" aria-modal="false" aria-labelledby="platform-assistant-title" hidden>
    <header class="platform-assistant-header">
      <img src="{{ url_for('static', filename='img/assistant/robot_assistente.png') }}" alt="" width="36" height="36">
      <h2 id="platform-assistant-title">Assistente Análysis</h2>
      <button class="platform-assistant-close" type="button" data-assistant-close aria-label="Fechar Assistente Análysis" title="Fechar">×</button>
    </header>
    <div class="platform-assistant-body" data-assistant-body>
      <p class="platform-assistant-message is-assistant">{{ assistant_context.intro }}</p>
      <div class="platform-assistant-suggestions" aria-label="Perguntas sugeridas">
        {% for suggestion in assistant_context.suggestions %}<button type="button" data-assistant-question="{{ loop.index0 }}">{{ suggestion.question }}</button>{% endfor %}
      </div>
      <div class="platform-assistant-messages" data-assistant-messages role="log" aria-live="polite" aria-relevant="additions"></div>
    </div>
    <form class="platform-assistant-form" data-assistant-form action="{{ url_for('assistant.ask') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" data-assistant-csrf>
      <label class="visually-hidden" for="platform-assistant-question">Pergunta ao Assistente Análysis</label>
      <div class="platform-assistant-composer">
        <input id="platform-assistant-question" data-assistant-input type="text" name="question" placeholder="Faça uma pergunta..." maxlength="1000" autocomplete="off" required aria-describedby="platform-assistant-error">
        <button type="submit" data-assistant-send>Enviar</button>
      </div>
      <p id="platform-assistant-error" class="platform-assistant-error" data-assistant-error role="alert" hidden></p>
    </form>
  </section>
  <button class="platform-assistant-avatar" type="button" data-assistant-toggle aria-label="Abrir Assistente Análysis" aria-controls="platform-assistant-panel" aria-expanded="false" title="Assistente Análysis">
    <img src="{{ url_for('static', filename='img/assistant/robot_assistente.png') }}" alt="" width="64" height="64">
  </button>
  <script type="application/json" data-assistant-payload>{{ assistant_context | tojson }}</script>
</div>
